<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="5" fill="#ff6c37"/>
  <text x="400" y="48" font-family="Arial" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Newman CLI Execution &amp; Reports</text>
  <text x="400" y="68" font-family="Arial" font-size="12" fill="#aaaacc" text-anchor="middle">Automated CLI run with HTML + JSON output</text>

  <!-- Terminal block -->
  <rect x="60" y="85" width="680" height="180" rx="8" fill="#0d1117"/>
  <rect x="60" y="85" width="680" height="28" rx="8" fill="#21262d"/>
  <circle cx="84" cy="99" r="6" fill="#ff5f57"/>
  <circle cx="102" cy="99" r="6" fill="#febc2e"/>
  <circle cx="120" cy="99" r="6" fill="#28c840"/>
  <text x="400" y="104" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">Terminal</text>
  <text x="80" y="132" font-family="monospace" font-size="10" fill="#8b949e">$</text>
  <text x="95" y="132" font-family="monospace" font-size="10" fill="#ff6c37">npm install -g newman newman-reporter-htmlextra</text>
  <text x="80" y="155" font-family="monospace" font-size="10" fill="#8b949e">$</text>
  <text x="95" y="155" font-family="monospace" font-size="10" fill="#7ee787">newman run petstore_collection.json \</text>
  <text x="95" y="173" font-family="monospace" font-size="10" fill="#7ee787">  -e petstore_environment.json \</text>
  <text x="95" y="191" font-family="monospace" font-size="10" fill="#7ee787">  -r cli,htmlextra,json \</text>
  <text x="95" y="209" font-family="monospace" font-size="10" fill="#7ee787">  --reporter-htmlextra-export reports/report.html \</text>
  <text x="95" y="227" font-family="monospace" font-size="10" fill="#7ee787">  --reporter-json-export reports/report.json</text>
  <text x="80" y="250" font-family="monospace" font-size="10" fill="#8b949e">→</text>
  <text x="95" y="250" font-family="monospace" font-size="10" fill="#a5d6ff">16 requests · 0 failures · ✓ All assertions passed</text>

  <!-- Report output cards -->
  <rect x="60" y="290" width="200" height="80" rx="8" fill="#ff6c37" fill-opacity="0.1" stroke="#ff6c37" stroke-width="1" stroke-opacity="0.4"/>
  <text x="160" y="322" font-family="Arial" font-size="14" fill="#ff6c37" text-anchor="middle" font-weight="bold">HTML Report</text>
  <text x="160" y="342" font-family="Arial" font-size="10" fill="#8b949e" text-anchor="middle">reports/report.html</text>
  <text x="160" y="358" font-family="Arial" font-size="10" fill="#8b949e" text-anchor="middle">htmlextra · Full detail</text>

  <rect x="300" y="290" width="200" height="80" rx="8" fill="#2196f3" fill-opacity="0.1" stroke="#2196f3" stroke-width="1" stroke-opacity="0.4"/>
  <text x="400" y="322" font-family="Arial" font-size="14" fill="#64b5f6" text-anchor="middle" font-weight="bold">JSON Report</text>
  <text x="400" y="342" font-family="Arial" font-size="10" fill="#8b949e" text-anchor="middle">reports/report.json</text>
  <text x="400" y="358" font-family="Arial" font-size="10" fill="#8b949e" text-anchor="middle">Machine-readable output</text>

  <rect x="540" y="290" width="200" height="80" rx="8" fill="#4caf50" fill-opacity="0.1" stroke="#4caf50" stroke-width="1" stroke-opacity="0.4"/>
  <text x="640" y="322" font-family="Arial" font-size="14" fill="#81c784" text-anchor="middle" font-weight="bold">CLI Output</text>
  <text x="640" y="342" font-family="Arial" font-size="10" fill="#8b949e" text-anchor="middle">Real-time terminal</text>
  <text x="640" y="358" font-family="Arial" font-size="10" fill="#8b949e" text-anchor="middle">Pass/Fail per request</text>

  <!-- Assertions row -->
  <text x="400" y="410" font-family="Arial" font-size="12" fill="#aaaacc" text-anchor="middle">Assertions: Status Code · Schema · Content-Type · Response Time</text>
  <text x="400" y="470" font-family="Arial" font-size="11" fill="#555577" text-anchor="middle">hardisahrulaj.github.io · QA Portfolio</text>
</svg>
