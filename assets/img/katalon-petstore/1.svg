<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="800" height="500" fill="#0d1117"/>
  <rect x="0" y="0" width="800" height="56" fill="#e8392d" opacity="0.9"/>
  <text x="400" y="34" text-anchor="middle" fill="white" font-size="18" font-weight="700">Katalon Studio — Petstore API Automation</text>
  <text x="400" y="50" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Layered Architecture · Carry-Over State · Extent Report</text>

  <rect x="30" y="80" width="740" height="58" rx="8" fill="#e8392d" opacity="0.12" stroke="#e8392d" stroke-width="1.5"/>
  <text x="50" y="104" fill="#e8392d" font-size="11" font-weight="700">LAYER 1 — TEST SUITE</text>
  <text x="50" y="124" fill="#c9d1d9" font-size="12">Local Test Suite.ts  ·  Description: "PET-10,sit" / "pet,sit" / "store,sit" / "user,sit"</text>

  <line x1="400" y1="138" x2="400" y2="156" stroke="#e8392d" stroke-width="2"/>
  <text x="420" y="151" fill="#8b949e" font-size="10">BeforeTestSuite: load .dat, validate tags</text>

  <rect x="30" y="160" width="740" height="68" rx="8" fill="#1f6feb" opacity="0.1" stroke="#388bfd" stroke-width="1.5"/>
  <text x="50" y="180" fill="#388bfd" font-size="11" font-weight="700">LAYER 2 — SCENARIOS (Test Cases/Scenarios/)</text>
  <rect x="50" y="188" width="200" height="30" rx="6" fill="#1f6feb" opacity="0.3"/>
  <text x="150" y="208" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="600">Pet (9 scenarios)</text>
  <rect x="300" y="188" width="200" height="30" rx="6" fill="#1f6feb" opacity="0.3"/>
  <text x="400" y="208" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="600">Store (5 scenarios)</text>
  <rect x="550" y="188" width="200" height="30" rx="6" fill="#1f6feb" opacity="0.3"/>
  <text x="650" y="208" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="600">User (6 scenarios)</text>

  <line x1="400" y1="228" x2="400" y2="246" stroke="#388bfd" stroke-width="2"/>
  <text x="420" y="241" fill="#8b949e" font-size="10">executePreTest / executeMainTest / executePostTest</text>

  <rect x="30" y="250" width="740" height="58" rx="8" fill="#238636" opacity="0.1" stroke="#2ea043" stroke-width="1.5"/>
  <text x="50" y="270" fill="#2ea043" font-size="11" font-weight="700">LAYER 3 — STEPS (Test Cases/Steps/Service/)</text>
  <text x="50" y="292" fill="#c9d1d9" font-size="12">pet/pet · pet/find-by-status · store/store · store/inventory · store/delete-order · user/user · user/login · user/update-user · user/delete-user</text>

  <line x1="400" y1="308" x2="400" y2="326" stroke="#2ea043" stroke-width="2"/>

  <rect x="30" y="330" width="740" height="68" rx="8" fill="#6e40c9" opacity="0.1" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="50" y="350" fill="#8b5cf6" font-size="11" font-weight="700">LAYER 4 — HELPERS (Include/scripts/groovy/)</text>
  <rect x="50" y="358" width="120" height="28" rx="5" fill="#6e40c9" opacity="0.3"/>
  <text x="110" y="377" text-anchor="middle" fill="#d2a8ff" font-size="10">ApiHelper.groovy</text>
  <rect x="185" y="358" width="120" height="28" rx="5" fill="#6e40c9" opacity="0.3"/>
  <text x="245" y="377" text-anchor="middle" fill="#d2a8ff" font-size="10">Context.groovy</text>
  <rect x="320" y="358" width="130" height="28" rx="5" fill="#6e40c9" opacity="0.3"/>
  <text x="385" y="377" text-anchor="middle" fill="#d2a8ff" font-size="10">ExtentReport.groovy</text>
  <rect x="465" y="358" width="120" height="28" rx="5" fill="#6e40c9" opacity="0.3"/>
  <text x="525" y="377" text-anchor="middle" fill="#d2a8ff" font-size="10">Validate.groovy</text>
  <rect x="600" y="358" width="110" height="28" rx="5" fill="#6e40c9" opacity="0.3"/>
  <text x="655" y="377" text-anchor="middle" fill="#d2a8ff" font-size="10">Logger.groovy</text>

  <line x1="400" y1="398" x2="400" y2="416" stroke="#8b5cf6" stroke-width="2"/>

  <rect x="200" y="420" width="400" height="44" rx="8" fill="#e8392d" opacity="0.18" stroke="#e8392d" stroke-width="1.5"/>
  <text x="400" y="440" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="700">petstore.swagger.io/v2</text>
  <text x="400" y="456" text-anchor="middle" fill="#8b949e" font-size="10">/pet · /store/order · /store/inventory · /user</text>

  <text x="770" y="492" text-anchor="end" fill="#484f58" font-size="10">20 scenarios · 3 services · Groovy + Katalon Studio</text>
