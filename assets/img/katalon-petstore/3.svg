  <!-- Log lines mockup -->
  <text x="35" y="192" fill="#8b949e" font-size="10">Scenario Log</text>
  <rect x="35" y="198" width="450" height="16" rx="3" fill="#0d1117"/>
  <text x="42" y="210" fill="#7ee787" font-size="9">✓ PASS  add new pet with status available  [petId: 9182736]</text>
  <rect x="35" y="216" width="450" height="16" rx="3" fill="#0d1117"/>
  <text x="42" y="228" fill="#7ee787" font-size="9">✓ PASS  get pet by id  [GET /pet/9182736 → 200 OK]</text>
  <rect x="35" y="234" width="450" height="16" rx="3" fill="#0d1117"/>
  <text x="42" y="246" fill="#7ee787" font-size="9">✓ PASS  update pet name and status  [PUT /pet → 200 OK]</text>
  <rect x="35" y="252" width="450" height="16" rx="3" fill="#0d1117"/>
  <text x="42" y="264" fill="#f85149" font-size="9">✗ NEG   get pet not found  [GET /pet/9999999 → 404 Not Found]</text>
  <rect x="35" y="270" width="450" height="16" rx="3" fill="#0d1117"/>
  <text x="42" y="282" fill="#7ee787" font-size="9">✓ PASS  place order for pet  [POST /store/order → 200 OK]</text>
  <rect x="35" y="288" width="450" height="16" rx="3" fill="#0d1117"/>
  <text x="42" y="300" fill="#7ee787" font-size="9">✓ PASS  create new user  [POST /user → 200 OK]</text>
  <rect x="35" y="306" width="450" height="16" rx="3" fill="#0d1117"/>
  <text x="42" y="318" fill="#7ee787" font-size="9">✓ PASS  TC010 Full Lifecycle Flow  [add→get→update→delete]</text>

