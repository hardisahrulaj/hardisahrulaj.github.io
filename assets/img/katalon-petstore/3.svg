  <rect x="655" y="214" width="110" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="710" y="233" text-anchor="middle" fill="#c9d1d9" font-size="11">Failure Propagation</text>

  <rect x="535" y="252" width="110" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="590" y="271" text-anchor="middle" fill="#c9d1d9" font-size="11">E2E + Per Service</text>

  <rect x="655" y="252" width="110" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="710" y="271" text-anchor="middle" fill="#c9d1d9" font-size="11">Swagger Petstore</text>

